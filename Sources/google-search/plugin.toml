id = "google-search"
name = "Google Search"
version = "1.0.0"
description = "A process node that searches Google with the Custom Search JSON API (Google Cloud) – the query comes from the input – and hands on the URLs of the hits; how many is set in the node or read from the input. For existing API customers: Google takes no new ones and switches the API off on 1 January 2027."
author = "Mike Bertram · mibexx"
license = "MIT"
theron_api = 1
min_theron = "0.20.0"
entry = "google_search"
permissions = ["network", "ai"]

[[settings]]
key = "api_key"
type = "secret"
label = "Google API key"
description = "Google Cloud console → APIs & Services → Credentials → API key, in a project with the “Custom Search API” enabled. Cost (Google): 100 queries per day free, then $5 per 1,000 – at most 10,000 per day; one query = up to 10 results. Google closed the API to new customers and switches it off on 1 January 2027."
required = true

[[settings]]
key = "cx"
type = "text"
label = "Search engine ID (cx)"
description = "programmablesearchengine.google.com → your search engine → Overview → “Search engine ID”. For the whole web, switch on “Search the entire web” there."
required = true

[[settings]]
key = "country"
type = "text"
label = "Country"
default = "de"
description = "Two letters like de, us, ch – boosts results from that country. Empty: Google decides. A node can set its own."

[[settings]]
key = "language"
type = "text"
label = "Language"
default = "de"
description = "Two letters like de or en – results in that language. Empty: any. A node can set its own."
