id = "brightdata"
name = "Bright Data Scraper"
version = "1.0.0"
description = "A process node that loads web pages through Bright Data's Web Unlocker – their proxy network gets past bot protection, CAPTCHAs and geo blocks – and hands on the content as Markdown or raw HTML. Works with the URLs of Google Search / Google SERP; no browser needed, also on a server."
author = "Mike Bertram · mibexx"
license = "MIT"
theron_api = 1
min_theron = "0.20.0"
entry = "brightdata_scraper"
permissions = ["network", "files"]

[[settings]]
key = "api_key"
type = "secret"
label = "Bright Data API key"
description = "brightdata.com → Account settings → API keys. Approximate cost per 1,000 pages (Web Unlocker, October 2026): ≈ $1.50 pay as you go, ≈ $1.30 on the Scale plan ($499/month); 5,000 free per month. Only successful pages are billed."
required = true

[[settings]]
key = "zone"
type = "text"
label = "Web Unlocker zone"
default = "web_unlocker1"
description = "The name of your Web Unlocker zone (control panel → Proxies & Scraping → Web Unlocker)."
required = true

[[settings]]
key = "country"
type = "text"
label = "Country"
default = "de"
description = "Two letters like de, at, us – the pages are loaded from that country (prices, language, geo blocks). Empty: Bright Data decides. A node can set its own."

[[settings]]
key = "render"
type = "bool"
label = "Run JavaScript"
default = false
description = "Loads the page in a browser at Bright Data first – for shops that only show prices after JavaScript. Slower; off is enough for most pages."

[[settings]]
key = "parallel"
type = "number"
label = "Pages at once"
default = 5
description = "Requests at the same time, 1–20."

[[settings]]
key = "timeout"
type = "number"
label = "Timeout per page (seconds)"
default = 120
description = "Hard pages can take a minute while Bright Data gets past the protection."
